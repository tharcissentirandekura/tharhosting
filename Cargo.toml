[package]
name = "tharhosting"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.11.0", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11.5"
log = "0.4"
tokio = {version="1.0", features=["full"]}
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4.3"
subtle = "2.6.1"
dotenvy = "0.15.7"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
